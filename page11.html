<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mimi 🎆💖</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    height: 100vh;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    color: white;
    overflow: hidden;
    text-align: center;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 20px;
    color: #ff1493;
    text-shadow: 2px 2px 10px #000;
  }

  #fireworksArea {
    position: relative;
    width: 100%;
    height: 70%;
    overflow: hidden;
  }

  .firework {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background-color: white;
    animation: explode 1s ease-out forwards;
  }

  @keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(4); opacity: 0; }
  }

  button {
    padding: 15px 30px;
    font-size: 1.2rem;
    border: none;
    border-radius: 25px;
    background-color: #fff;
    color: #ff1493;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 2px 2px 10px #000;
  }
</style>
</head>
<body>
  <h1>Happy Birthday Mimi 💖🎆</h1>
  <button id="fireworkBtn">Launch Fireworks!</button>

  <div id="fireworksArea"></div>

  <script>
    const fireworkBtn = document.getElementById('fireworkBtn');
    const fireworksArea = document.getElementById('fireworksArea');

    fireworkBtn.addEventListener('click', () => {
      for(let i=0; i<80; i++){  // More fireworks for a bigger effect
        const firework = document.createElement('div');
        firework.className = 'firework';
        firework.style.left = Math.random()*window.innerWidth + 'px';
        firework.style.top = Math.random()*window.innerHeight*0.7 + 'px';
        firework.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 70%)`;
        firework.style.width = firework.style.height = Math.random()*8 + 4 + 'px';
        firework.style.animationDuration = (Math.random()*1 + 0.5) + 's';
        fireworksArea.appendChild(firework);
        setTimeout(() => fireworksArea.removeChild(firework), 1000);
      }
    });
  </script>
</body>
</html>
