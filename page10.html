<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me? 💖</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #ffb6c1, #ff69b4);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
      text-shadow: 2px 2px 5px #000;
    }

    .options {
      display: flex;
      gap: 40px;
      margin-bottom: 20px;
    }

    .option-box {
      background-color: #ff69b4;
      padding: 20px 40px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: 2px 2px 8px #000;
      transition: transform 0.2s;
    }

    .option-box:hover {
      transform: scale(1.1);
    }

    #message {
      font-size: 1.5rem;
      margin-top: 20px;
      min-height: 40px;
    }

    #tryAgain {
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background-color: #fff;
      color: #ff1493;
      font-weight: bold;
      cursor: pointer;
      display: none;
      box-shadow: 2px 2px 8px #000;
    }

    .navigation {
      margin-top: 30px;
    }

    .navigation a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Do You Love Me, Mimi? 💖</h1>

  <div class="options">
    <div class="option-box" id="yes">Yes 💕</div>
    <div class="option-box" id="no">No 💔</div>
  </div>

  <div id="message"></div>
  <button id="tryAgain">Try Again 😡</button>

  <div class="navigation">
    <a href="page8.html" class="prev">Previous</a>
    <a href="page10.html" class="next">Next</a>
  </div>

  <script>
    const yesBtn = document.getElementById('yes');
    const noBtn = document.getElementById('no');
    const message = document.getElementById('message');
    const tryAgain = document.getElementById('tryAgain');

    yesBtn.addEventListener('click', () => {
      message.textContent = "Good girl 😘💖";
      tryAgain.style.display = 'none';
    });

    noBtn.addEventListener('click', () => {
      message.textContent = "How dare you! 😡";
      tryAgain.style.display = 'inline-block';
    });

    tryAgain.addEventListener('click', () => {
      message.textContent = "";
      tryAgain.style.display = 'none';
    });
  </script>
</body>
</html>
